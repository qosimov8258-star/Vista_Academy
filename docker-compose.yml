services:
  postgres:
    image: postgres:16-alpine
    container_name: bogcha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bogcha
      POSTGRES_PASSWORD: bogcha
      POSTGRES_DB: bogcha
    ports:
      - "5436:5432"
    volumes:
      - bogcha_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bogcha -d bogcha"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bogcha_postgres_data:
