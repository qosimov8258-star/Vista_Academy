const TIP=[77.85355339059325,0.7839648751429422], HREST=[[248,605],[451,605]], GRIP=[[-82,216],[82,216]], SHOULD=[[250,470],[450,470]];
const HOLD=[350,332], HOME=[860,440];
const imgs={};let loaded=0;
for(const k in A){const i=new Image();i.onload=()=>{if(++loaded==4)requestAnimationFrame(frame)};i.src=A[k];imgs[k]=i}
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),hint=document.getElementById('hint');
let tip=[...HOME],drag=false,off=[0,0],anim=null,t0=0,drinking=false,open=0,g=0;
const ease=t=>1-Math.pow(1-t,3);
function pt(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]}
function overBottle(p){return p[0]>tip[0]-TIP[0]&&p[0]<tip[0]-TIP[0]+imgs.bottle.width&&p[1]>tip[1]-TIP[1]&&p[1]<tip[1]-TIP[1]+imgs.bottle.height}
function dist(){return Math.hypot(tip[0]-HOLD[0],tip[1]-HOLD[1])}
cv.addEventListener('pointerdown',e=>{const p=pt(e);if(overBottle(p)){drag=true;anim=null;drinking=false;off=[tip[0]-p[0],tip[1]-p[1]];cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'}});
cv.addEventListener('pointermove',e=>{const p=pt(e);if(drag){tip=[p[0]+off[0],p[1]+off[1]]}else cv.style.cursor=overBottle(p)?'grab':'default'});
function release(){if(!drag)return;drag=false;cv.style.cursor='default';if(dist()<160)moveTo(HOLD,true);else moveTo(HOME,false)}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);
function moveTo(dst,drink){anim={from:[...tip],to:dst,t:performance.now(),dur:drink?350:450,drink}}
document.getElementById('reset').onclick=()=>{drag=false;drinking=false;anim=null;tip=[...HOME]};
function heart(x,y,s,col,a){ctx.save();ctx.globalAlpha=a;ctx.fillStyle=col;ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();
  for(let i=0;i<=60;i++){const t=i/60*Math.PI*2,hx=16*Math.pow(Math.sin(t),3),hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));i?ctx.lineTo(hx,hy):ctx.moveTo(hx,hy)}
  ctx.fill();ctx.restore()}
function frame(now){
  if(anim){const k=Math.min(1,(now-anim.t)/anim.dur),e=ease(k);tip=[anim.from[0]+(anim.to[0]-anim.from[0])*e,anim.from[1]+(anim.to[1]-anim.from[1])*e];
    if(k>=1){if(anim.drink){drinking=true;t0=now}anim=null}}
  const d=dist();
  const tOpen=drinking?1:Math.max(0,Math.min(1,(260-d)/170));
  const tG=drinking?1:Math.max(0,Math.min(1,(330-d)/180));
  open+=(tOpen-open)*0.2;g+=(tG-g)*0.2;
  hint.textContent=drinking?'Bola ichyapti \u2764':(drag?'Bolaning og\'ziga olib boring':'Soskani sichqoncha bilan ushlab, chiziq bo\'ylab bolaga olib boring');
  const ph=drinking?(now-t0)/1000*2*Math.PI*1.3:0;
  const dy=drinking?Math.sin(ph)*2.5:0;
  ctx.fillStyle='#f7f7f7';ctx.fillRect(0,0,1000,800);
  ctx.save();ctx.translate(0,dy);
  ctx.drawImage(imgs.baby,0,0);
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.strokeStyle='#ffa9c8';ctx.lineWidth=5;ctx.setLineDash([2,14]);ctx.lineCap='round';ctx.globalAlpha=drinking?0.25:0.9;
  ctx.beginPath();ctx.moveTo(HOME[0],HOME[1]);ctx.bezierCurveTo(860,250,700,250,520,340);ctx.stroke();ctx.restore();
  if(open>0.02){ctx.fillStyle='#f7d0c3';ctx.beginPath();ctx.ellipse(350,368,50,30,0,0,7);ctx.fill();
    const w=10+14*open,h=4+15*open+(drinking?3*Math.abs(Math.sin(ph/2)):0);
    ctx.fillStyle='#be645a';ctx.beginPath();ctx.ellipse(350,364,w,h/2+2,0,0,7);ctx.fill();
    ctx.fillStyle='#964646';ctx.beginPath();ctx.ellipse(350,366,w-4,Math.max(1,h/2-2),0,0,7);ctx.fill()}
  const bx=tip[0],by=tip[1];
  ctx.save();ctx.translate(bx,by);if(drinking)ctx.rotate(Math.sin(ph)*0.035);ctx.drawImage(imgs.bottle,-TIP[0],-TIP[1]);ctx.restore();
  [['hl',0],['hr',1]].forEach(([k,i])=>{
    const rest=HREST[i],gr=[bx+GRIP[i][0],by+GRIP[i][1]];
    const x=rest[0]+(gr[0]-rest[0])*g,y=rest[1]+(gr[1]-rest[1])*g;
    if(g>0.01){ctx.strokeStyle='#c3d8fa';ctx.lineCap='round';ctx.setLineDash([]);ctx.lineWidth=46;
      ctx.beginPath();ctx.moveTo(SHOULD[i][0],SHOULD[i][1]);ctx.lineTo(x,y);ctx.stroke();}
    ctx.drawImage(imgs[k],x-imgs[k].width/2,y-imgs[k].height/2)});
  ctx.restore();
  if(drinking){const tt=(now-t0)/1000;for(let i=0;i<6;i++){const p=((tt*0.45)+i/6)%1,side=i%2?1:-1;
    const x=350+side*(190+(i%3)*22)+Math.sin(p*6+i)*14,y=330-p*230,s=(0.6+0.5*Math.sin(p*Math.PI))*1.5;
    heart(x,y+20,s,['#ff5c8c','#ff8caf','#f03c6e'][i%3],Math.max(0,Math.min(1,Math.sin(p*Math.PI)*1.4)))}}
  requestAnimationFrame(frame)}
